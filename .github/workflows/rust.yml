name: Rust

on:
  push:
    branches: [main, library-latest]
  pull_request:
    branches: [main, library-latest]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --all-features --locked

      - name: Lint all targets
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run all tests
        run: cargo test --all-targets --all-features --locked

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          bash scripts/ci/job-summary.sh \
            --verdict "${{ job.status }}" \
            --title "fastqcx — quality gate" \
            --checked "Formatting, a check of all targets, Clippy with warnings denied, and the full test suite." \
            --check "cargo fmt --check|no diffs|see step log|-" \
            --check "cargo check --all-targets|compiles|see step log|-" \
            --check "cargo clippy -D warnings|no warnings|see step log|-" \
            --check "cargo test --all-targets|all tests pass|see step log|-" \
            --limit "Static quality gate. The compatibility job separately checks declared SeqKit fields and three FastQC modules on a real fixture."

  compatibility:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    env:
      FIXTURE_BASE_URL: https://huggingface.co/datasets/fallingstar10/otter-data/resolve/e3883a3b69ca8a598cf28d628adaa57ee67c4c67
      FIXTURE_DIRECTORY: ci-artifacts/fixture/fastqcx/rna-pdx-srr30880970
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pinned enva source
        uses: actions/checkout@v4
        with:
          repository: otterlab-bio/enva
          ref: 3559ddf7a5b46d3aee78c0f1a6222850ecbc8fa7
          path: .ci/enva

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build pinned enva
        working-directory: .ci/enva
        run: cargo build --release --locked --bin enva

      - name: Create fixed FastQC and SeqKit environment through enva
        run: |
          set -euo pipefail
          export RATTLER_CACHE_DIR="${RUNNER_TEMP:-/tmp}/rattler-cache"
          mkdir -p ci-artifacts/enva "$RATTLER_CACHE_DIR"
          .ci/enva/target/release/enva create \
            --yaml tests/resources/fastqcx-compatibility.yaml \
            --name fastqcx-compatibility \
            --force \
            --clean-cache \
            --output summary \
            2>&1 | tee ci-artifacts/enva/create.log
          .ci/enva/target/release/enva run \
            --name fastqcx-compatibility \
            --command 'fastqc --version' \
            2>&1 | tee ci-artifacts/enva/fastqc-version.log
          .ci/enva/target/release/enva run \
            --name fastqcx-compatibility \
            --command 'seqkit version' \
            2>&1 | tee ci-artifacts/enva/seqkit-version.log
          grep -q 'FastQC v0.12.1' ci-artifacts/enva/fastqc-version.log
          grep -q 'seqkit v2.13.0' ci-artifacts/enva/seqkit-version.log

      - name: Download and verify real RNA-PDX fixture
        run: |
          set -euo pipefail
          mkdir -p "$FIXTURE_DIRECTORY" ci-artifacts/provenance
          curl --fail --location --silent --show-error \
            "$FIXTURE_BASE_URL/provenance/checksums.sha256" \
            --output ci-artifacts/provenance/checksums.sha256
          curl --fail --location --silent --show-error \
            "$FIXTURE_BASE_URL/fastqcx/rna-pdx-srr30880970/R1.fastq.gz" \
            --output "$FIXTURE_DIRECTORY/R1.fastq.gz"
          curl --fail --location --silent --show-error \
            "$FIXTURE_BASE_URL/fastqcx/rna-pdx-srr30880970/R2.fastq.gz" \
            --output "$FIXTURE_DIRECTORY/R2.fastq.gz"
          awk -v read_one="$FIXTURE_DIRECTORY/R1.fastq.gz" \
              -v read_two="$FIXTURE_DIRECTORY/R2.fastq.gz" '
            $2 ~ /fastqcx\/rna-pdx-srr30880970\/R1\.fastq\.gz$/ { $2 = read_one; print; next }
            $2 ~ /fastqcx\/rna-pdx-srr30880970\/R2\.fastq\.gz$/ { $2 = read_two; print; next }
          ' ci-artifacts/provenance/checksums.sha256 \
            > ci-artifacts/provenance/fastqcx-checksums.sha256
          sha256sum --check ci-artifacts/provenance/fastqcx-checksums.sha256

      - name: Build fastqcx
        run: cargo build --locked

      - name: Enforce real-fixture runtime and memory budget
        env:
          FASTQCX_FIXTURE: ${{ env.FIXTURE_DIRECTORY }}/R1.fastq.gz
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import resource
          import subprocess
          import time

          fixture_path = os.environ['FASTQCX_FIXTURE']
          summary_directory = Path('ci-artifacts/fastqcx')
          started = time.monotonic()
          subprocess.run(
              [
                  'target/debug/fastqcx',
                  '--fastq', fixture_path,
                  '--kmer', '7',
                  '--summary', str(summary_directory),
                  '--no-html',
              ],
              check=True,
          )
          elapsed_seconds = time.monotonic() - started
          peak_rss_kib = resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss
          Path('ci-artifacts/runtime-memory.tsv').write_text(
              'fixture\telapsed_seconds\tpeak_rss_kib\n'
              f'{fixture_path}\t{elapsed_seconds:.3f}\t{peak_rss_kib}\n'
          )
          assert elapsed_seconds <= 120, elapsed_seconds
          assert peak_rss_kib <= 512 * 1024, peak_rss_kib
          assert (summary_directory / 'fastqc_data.txt').is_file()
          PY

      - name: Run FastQC and SeqKit through enva
        run: |
          set -euo pipefail
          fixture_fastq="$FIXTURE_DIRECTORY/R1.fastq.gz"
          mkdir -p ci-artifacts/fastqc ci-artifacts/seqkit
          .ci/enva/target/release/enva run \
            --name fastqcx-compatibility \
            --command "fastqc --extract --outdir ci-artifacts/fastqc $fixture_fastq" \
            2>&1 | tee ci-artifacts/fastqc/fastqc-command.log
          .ci/enva/target/release/enva run \
            --name fastqcx-compatibility \
            --command "seqkit stats --all --tabular $fixture_fastq" \
            > ci-artifacts/seqkit/stats.tsv

      - name: Compare FastQC and SeqKit contracts
        run: |
          python3 scripts/compare_fastqc_seqkit.py \
            --fastqcx-summary ci-artifacts/fastqcx/fastqc_data.txt \
            --fastqc-summary ci-artifacts/fastqc/R1_fastqc/fastqc_data.txt \
            --seqkit-stats ci-artifacts/seqkit/stats.tsv \
            --output ci-artifacts/parity-report.json

      - name: Exercise non-empty duplication and overrepresentation controls
        run: |
          set -euo pipefail
          mkdir -p \
            ci-artifacts/positive-control/fastqcx \
            ci-artifacts/positive-control/fastqc \
            ci-artifacts/positive-control/seqkit
          python3 - <<'PY'
          from pathlib import Path

          alphabet = "ACGT"

          def sequence_identity(value: int) -> str:
              bases = []
              for _ in range(50):
                  bases.append(alphabet[value % len(alphabet)])
                  value //= len(alphabet)
              return "".join(bases)

          records = ["A" * 80] * 600
          records.extend(sequence_identity(index) + "C" * 30 for index in range(1, 401))
          lines = []
          for index, sequence in enumerate(records):
              # A single low Phred+33 value removes FastQC's otherwise ambiguous
              # interpretation of an all-`I` synthetic quality alphabet as Phred+64.
              quality = "I" * len(sequence)
              if index == 0:
                  quality = "!" + quality[1:]
              lines.extend((f"@positive-{index}", sequence, "+", quality))
          Path("ci-artifacts/positive-control/positive.fastq").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          target/debug/fastqcx \
            --fastq ci-artifacts/positive-control/positive.fastq \
            --kmer 7 \
            --summary ci-artifacts/positive-control/fastqcx \
            --no-html
          .ci/enva/target/release/enva run \
            --name fastqcx-compatibility \
            --command 'fastqc --extract --outdir ci-artifacts/positive-control/fastqc ci-artifacts/positive-control/positive.fastq'
          .ci/enva/target/release/enva run \
            --name fastqcx-compatibility \
            --command 'seqkit stats --all --tabular ci-artifacts/positive-control/positive.fastq' \
            > ci-artifacts/positive-control/seqkit/stats.tsv
          python3 scripts/compare_fastqc_seqkit.py \
            --fastqcx-summary ci-artifacts/positive-control/fastqcx/fastqc_data.txt \
            --fastqc-summary ci-artifacts/positive-control/fastqc/positive_fastqc/fastqc_data.txt \
            --seqkit-stats ci-artifacts/positive-control/seqkit/stats.tsv \
            --output ci-artifacts/positive-control/parity-report.json \
            --require-overrepresented

      - name: Remove compatibility environment through enva
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/enva
          if .ci/enva/target/release/enva validate --name fastqcx-compatibility \
            > ci-artifacts/enva/pre-remove-validate.log 2>&1; then
            .ci/enva/target/release/enva remove fastqcx-compatibility \
              2>&1 | tee ci-artifacts/enva/remove.log
          fi

      - name: Upload FastQC and SeqKit compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastqcx-rna-pdx-compatibility-evidence
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 90

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          # Report the measured comparison, not a restatement of the assertions.
          bash scripts/ci/summary-field.sh \
            ci-artifacts/parity-report.json#integer_fields_matched \
            ci-artifacts/parity-report.json#integer_fields_compared \
            ci-artifacts/parity-report.json#decimal_fields_within_tolerance \
            ci-artifacts/parity-report.json#decimal_fields_compared \
            ci-artifacts/parity-report.json#largest_decimal_deviation \
            ci-artifacts/parity-report.json#official_fastqc_total_sequences \
            ci-artifacts/parity-report.json#official_fastqc_gc_percent \
            ci-artifacts/parity-report.json#fastqc_per_base_values_compared \
            ci-artifacts/parity-report.json#fastqc_per_base_maximum_difference \
            ci-artifacts/parity-report.json#fastqc_duplication_levels_compared \
            ci-artifacts/parity-report.json#fastqc_duplication_maximum_difference \
            ci-artifacts/parity-report.json#fastqc_overrepresented_sequences_compared \
            ci-artifacts/parity-report.json#fastqc_overrepresented_maximum_difference \
            > ci-artifacts/summary-fields.txt 2>/dev/null || true
          field() { rg -N "^$1=" ci-artifacts/summary-fields.txt 2>/dev/null | head -n 1 | cut -d= -f2- || echo "-"; }
          budget="-"
          if [[ -f ci-artifacts/runtime-memory.tsv ]]; then
            budget="$(tail -n 1 ci-artifacts/runtime-memory.tsv | awk -F'\t' '{printf "%.1f s, %.0f MiB peak RSS", $2, $3/1024}')"
          fi
          fastqcx_total="-"
          if [[ -f ci-artifacts/fastqcx/fastqc_data.txt ]]; then
            fastqcx_total="$(rg -N '^Total Sequences\t' ci-artifacts/fastqcx/fastqc_data.txt | head -n 1 | cut -f2 || echo '-')"
          fi
          positive_overrepresented="-"
          positive_duplication="-"
          if [[ -f ci-artifacts/positive-control/parity-report.json ]]; then
            read -r positive_overrepresented positive_duplication < <(python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("ci-artifacts/positive-control/parity-report.json").read_text())
          print(
              report["fastqc_overrepresented_sequences_compared"],
              report["fastqc_modules"]["sequence_duplication_levels"]["deduplicated_percentage"],
          )
          PY
            )
          fi
          bash scripts/ci/job-summary.sh \
            --verdict "${{ job.status }}" \
            --title "fastqcx — FastQC and SeqKit parity on a real fixture" \
            --scope "RNA-PDX SRR30880970 R1 plus a deterministic duplicated-read positive control" \
            --checked "Runs fastqcx, FastQC v0.12.1, and SeqKit v2.13.0 on the same real RNA-PDX reads. SeqKit fields use exact or declared-tolerance comparisons; FastQC comparisons cover per-base quality values, duplication levels, and overrepresented-sequence identities, counts, percentages, and module verdicts." \
            --check "SeqKit integer statistics exact|11 of 11 fields|$(field integer_fields_matched) of $(field integer_fields_compared)|-" \
            --check "SeqKit decimal statistics within tolerance|5 of 5 fields|$(field decimal_fields_within_tolerance) of $(field decimal_fields_compared)|-" \
            --check "FastQC per-base quality values|all grouped values within 0.01|$(field fastqc_per_base_values_compared) values, max difference $(field fastqc_per_base_maximum_difference)|-" \
            --check "FastQC sequence duplication levels|all levels and deduplicated percentage within 0.01|$(field fastqc_duplication_levels_compared) levels, max difference $(field fastqc_duplication_maximum_difference)|-" \
            --check "FastQC overrepresented sequences|identities and counts exact; percentages within 0.01|$(field fastqc_overrepresented_sequences_compared) sequences, max difference $(field fastqc_overrepresented_maximum_difference)|-" \
            --check "FastQC positive control|at least one overrepresented sequence; identities/counts exact|${positive_overrepresented} sequences, ${positive_duplication}% deduplicated|-" \
            --check "Total sequences agree across fastqcx, FastQC and SeqKit|all three equal|fastqcx $(field fastqcx_total) / FastQC $(field official_fastqc_total_sequences)|-" \
            --check "Runtime and memory budget|<= 120 s and <= 512 MiB peak RSS|${budget}|-" \
            --metric "Compared tools|fastqcx (this build), FastQC v0.12.1, SeqKit v2.13.0 (via enva)" \
            --metric "SeqKit fields|11 integer fields and 5 decimal fields" \
            --metric "FastQC modules|Per base sequence quality, Sequence Duplication Levels, Overrepresented sequences" \
            --artifact "fastqcx-rna-pdx-compatibility-evidence" \
            --limit "Parity is established on one real human RNA-PDX read file plus a deterministic positive control for duplication and overrepresentation, limited to the explicitly listed fields and modules. Adapter content, per-tile quality, and other FastQC-only modules remain outside this comparison." \
            --note "parity-report.json records every tolerance and maximum observed deviation; raw fastqcx, FastQC, and SeqKit outputs are retained with the workflow artifact."
